name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # libnosql is built from source next to this checkout. Bump the pin together
  # with any change that depends on a newer libnosql API.
  LIBNOSQL_REPO: philipp-orlov/libnosql
  LIBNOSQL_REF: main
  # libcore (base, json, ...): libnosql and libsql both expect it as a sibling checkout.
  LIBCORE_REPO: philipp-orlov/libcore
  LIBCORE_REF: main
  # libbufs, likewise: the binary result format (SQL_WITH_BUFS) builds from source.
  LIBBUFS_REPO: philipp-orlov/libbufs
  LIBBUFS_REF: main
  # libhttp, likewise: the WebSocket server routes and client behind remote databases (SQL_WITH_REMOTE).
  # Pin it to a commit once the libhttp work is on main.
  LIBHTTP_REPO: philipp-orlov/libhttp
  LIBHTTP_REF: main
  # librpc, likewise: the remote protocol (SQL_WITH_REMOTE) and its compiler, rpcc.
  LIBRPC_REPO: philipp-orlov/librpc
  LIBRPC_REF: main

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cc: gcc
            cxx: g++
            build_type: Release
            asan: OFF
            werror: ON
          - name: gcc-debug-asan-ubsan
            cc: gcc
            cxx: g++
            build_type: Debug
            asan: ON
            werror: ON
          # Clang reports unused-entity warnings in src/internal/dml.hpp
          # (Writer::prog_) and src/internal/pragma.cpp (unused `this` capture).
          # Flip to ON once those are fixed.
          - name: clang-release
            cc: clang
            cxx: clang++
            build_type: Release
            asan: OFF
            werror: OFF
    steps:
      - name: Check out libsql
        uses: actions/checkout@v4
        with:
          path: libsql

      - name: Check out libnosql
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LIBNOSQL_REPO }}
          ref: ${{ env.LIBNOSQL_REF }}
          path: libnosql

      - name: Check out libcore
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LIBCORE_REPO }}
          ref: ${{ env.LIBCORE_REF }}
          path: libcore

      - name: Check out libbufs
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LIBBUFS_REPO }}
          ref: ${{ env.LIBBUFS_REF }}
          path: libbufs

      - name: Check out libhttp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LIBHTTP_REPO }}
          ref: ${{ env.LIBHTTP_REF }}
          path: libhttp

      - name: Check out librpc
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LIBRPC_REPO }}
          ref: ${{ env.LIBRPC_REF }}
          path: librpc

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake libssl-dev
          if [ "${{ matrix.cc }}" = "clang" ]; then
            sudo apt-get install -y --no-install-recommends clang
          fi

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -G Ninja -S libsql -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSQL_NOSQL_DIR="$GITHUB_WORKSPACE/libnosql" \
            -DSQL_ENABLE_ASAN=${{ matrix.asan }} \
            -DSQL_BUILD_TESTS=ON \
            -DSQL_BUILD_EXAMPLES=ON \
            -DSQL_BUILD_TOOLS=ON \
            -DSQL_TOOL_WEB=OFF \
            -DCMAKE_CXX_FLAGS="${{ matrix.werror == 'ON' && '-Werror' || '' }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --parallel "$(nproc)"

      - name: Smoke-run examples and the sql tool
        run: |
          build/examples/quickstart
          build/examples/blobs
          build/examples/json
          build/tools/sql/sql --help
