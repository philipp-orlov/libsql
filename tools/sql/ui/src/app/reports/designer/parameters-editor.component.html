<div class="editor">
  <p class="intro">Parameters are asked for before the report runs. Datasets use them by name, for example <code>WHERE year = :year</code>; a blank value reaches the query as NULL.</p>
  @for (p of report().parameters; track $index; let i = $index) {
    <section class="card">
      <div class="row">
        <app-text class="field" label="Name" [mono]="true" [value]="p.name" (valueChange)="set(i, 'name', $event.trim())" />
        <app-text class="field" label="Label" [value]="p.label ?? ''" (valueChange)="set(i, 'label', $event)" />
        <app-select label="Type" [value]="p.type" [options]="types" [width]="120" (valueChange)="set(i, 'type', $event)" />
        <app-text class="field" label="Default" [value]="defaultText(p)" (valueChange)="setDefault(i, $event, p.type)" />
        <mat-checkbox class="check" [checked]="!!p.required" (change)="set(i, 'required', $event.checked)">Required</mat-checkbox>
        <span class="tools">
          <button mat-icon-button (click)="shift(i, -1)" [disabled]="i === 0" aria-label="Move up"><mat-icon>arrow_upward</mat-icon></button>
          <button mat-icon-button (click)="shift(i, 1)" [disabled]="i === report().parameters.length - 1" aria-label="Move down"><mat-icon>arrow_downward</mat-icon></button>
          <button mat-icon-button class="delete" (click)="remove(i)" aria-label="Delete parameter"><mat-icon>delete</mat-icon></button>
        </span>
      </div>
      <div class="row">
        <app-text class="field wide" label="Choices (value or value=Label per line)" [rows]="3" [value]="optionsText(p)" (valueChange)="setOptions(i, $event)" />
        <app-text class="field wide" label="Or choices from a query (value, label)" [rows]="3" [mono]="true" [value]="p.optionsSql ?? ''" (valueChange)="set(i, 'optionsSql', $event)" />
      </div>
    </section>
  } @empty {
    <p class="empty">This report has no parameters.</p>
  }
  <button mat-stroked-button class="add" (click)="add()"><mat-icon>add</mat-icon>Add parameter</button>
</div>
