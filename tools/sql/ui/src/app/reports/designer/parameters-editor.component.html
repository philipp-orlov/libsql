<div class="editor">
  <p class="intro">Parameters are asked for before the report runs. Datasets use them by name, for example <code>WHERE year = :year</code>; a blank value reaches the query as NULL.</p>
  @for (p of report().parameters; track $index; let i = $index) {
    <section class="card">
      <div class="row">
        <label class="field">Name <input class="mono" [value]="p.name" (change)="set(i, 'name', $any($event.target).value.trim())" /></label>
        <label class="field">Label <input [value]="p.label ?? ''" (change)="set(i, 'label', $any($event.target).value)" /></label>
        <label class="field">Type
          <select (change)="set(i, 'type', $any($event.target).value)">
            @for (t of types; track t) {
              <option [value]="t" [selected]="p.type === t">{{ t }}</option>
            }
          </select>
        </label>
        <label class="field">Default <input [value]="defaultText(p)" (change)="setDefault(i, $any($event.target).value, p.type)" /></label>
        <label class="check"><input type="checkbox" [checked]="!!p.required" (change)="set(i, 'required', $any($event.target).checked)" /> Required</label>
        <span class="tools">
          <button mat-icon-button (click)="shift(i, -1)" [disabled]="i === 0" aria-label="Move up"><mat-icon>arrow_upward</mat-icon></button>
          <button mat-icon-button (click)="shift(i, 1)" [disabled]="i === report().parameters.length - 1" aria-label="Move down"><mat-icon>arrow_downward</mat-icon></button>
          <button mat-icon-button class="delete" (click)="remove(i)" aria-label="Delete parameter"><mat-icon>delete</mat-icon></button>
        </span>
      </div>
      <div class="row">
        <label class="field wide">Choices, one per line (<code>value</code> or <code>value=Label</code>)
          <textarea rows="3" [value]="optionsText(p)" (change)="setOptions(i, $any($event.target).value)"></textarea>
        </label>
        <label class="field wide">Or choices from a query (first column the value, second the label)
          <textarea rows="3" class="mono" [value]="p.optionsSql ?? ''" (change)="set(i, 'optionsSql', $any($event.target).value)"></textarea>
        </label>
      </div>
    </section>
  } @empty {
    <p class="empty">This report has no parameters.</p>
  }
  <button mat-stroked-button class="add" (click)="add()"><mat-icon>add</mat-icon>Add parameter</button>
</div>
